[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.162.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
