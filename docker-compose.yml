services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:8000:8000
    environment:
      CODING_RAG_CONFIG: /app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
  marker:
    build:
      context: ./services/marker
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:8001:8001
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - 6333:6333
  ollama:
    image: ollama/ollama:latest
    ports:
      - 11434:11434
